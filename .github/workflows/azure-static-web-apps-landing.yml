name: Deploy landing page to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/azure-static-web-apps-landing.yml'
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'landing/**'

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure static HTML, no build step — app_location is the folder itself,
      # skip_app_build avoids Oryx trying (and failing) to detect a framework.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_LANDING_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'landing'
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close pull request preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_LANDING_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
