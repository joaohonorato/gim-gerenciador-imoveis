name: Deploy backend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/azure-container-apps-backend.yml'
  workflow_dispatch: {}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # GHCR instead of Azure Container Registry — ACR has no free tier,
      # GHCR is free for this repo.
      #
      # NOT using GITHUB_TOKEN here: this action stores the registry
      # password as the Container App's *runtime* pull credential too, not
      # just for this job's push. GITHUB_TOKEN is job-scoped and expires
      # shortly after the run finishes, so it works for the initial deploy
      # but silently breaks the next cold start / scale-from-zero / restart
      # (found by actually hitting that in production — Container Apps
      # reported 0 replicas, no useful error, just "Could not find a
      # replica for this app"). GHCR_PAT is a durable classic PAT with
      # write:packages scope (implies read) — see docs/deploy-azure.md.
      - name: Build and deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          dockerfilePath: Dockerfile
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GHCR_PAT }}
          imageToBuild: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppEnvironment: ${{ secrets.AZURE_CONTAINERAPPS_ENV }}
          targetPort: 8080
