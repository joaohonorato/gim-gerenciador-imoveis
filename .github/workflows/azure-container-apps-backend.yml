name: Deploy backend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/azure-container-apps-backend.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # GHCR instead of Azure Container Registry — ACR has no free tier,
      # GHCR is free for this repo and needs no extra secret (uses the
      # workflow's own GITHUB_TOKEN, scoped by `permissions: packages: write`
      # above).
      #
      # Builds backend/Dockerfile, pushes to ghcr.io, and updates the
      # Container App revision in one step. Env vars / secrets (DB_*, CORS_*,
      # RESEND_*, APP_TEST_SUPPORT_ENABLED) are configured on the Container
      # App resource itself (deploy/azure-setup.sh or az containerapp
      # update), not here.
      - name: Build and deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          dockerfilePath: Dockerfile
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          imageToBuild: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppEnvironment: ${{ secrets.AZURE_CONTAINERAPPS_ENV }}
          targetPort: 8080
