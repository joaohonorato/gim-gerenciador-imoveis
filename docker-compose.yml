services:
  postgres:
    image: postgres:16-alpine
    container_name: imoveis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-imoveis}
      POSTGRES_USER: ${DB_USER:-imoveis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-imoveis}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-imoveis} -d ${DB_NAME:-imoveis}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
